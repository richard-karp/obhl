# The tests that gate a merge. Before this existed the only PR checks were
# Vercel's deploy and preview comments, which say nothing about whether the
# suite passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR makes the first run's answer irrelevant, so
# supersede it. Pushes to `main` are never cancelled — each merge commit should
# end up with a CI result of its own rather than being superseded by the next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Types and unit tests: no database, no browser, so this is the fast answer.
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # ⛔ THE SEED MUST BE UNSHIFTED ON A MERGE. `clock-shifted.yml` rewrites
      # `v_shift_weeks` in `supabase/seed.sql` to run the suite against a future
      # fixture; that rewrite is meant to live for the length of one CI job and
      # never to be committed. A shift left in the file would move EVERY
      # developer's fixture and every normal CI run — and would very likely do it
      # while staying GREEN, because the whole 1..11 window is chosen to be
      # green, so nothing else here would ever report it.
      - name: The seeded fixture is not left clock-shifted
        run: |
          set -euo pipefail
          if ! grep -q '^  v_shift_weeks int := 0;$' supabase/seed.sql; then
            echo "::error file=supabase/seed.sql::supabase/seed.sql is committed with a non-zero clock shift. Run 'scripts/shift-seed-clock.sh 0' and commit that."
            grep -n 'v_shift_weeks int :=' supabase/seed.sql || true
            exit 1
          fi

      # `npm run build` does not typecheck the test files; this does, including
      # e2e/ under the CommonJS resolution Playwright actually runs it with.
      - run: npm run typecheck

      # `npm run lint` is bare `eslint`: it resolves its own file set from the
      # flat config, which is NOT the same set as `eslint src e2e` (the command
      # this gap was originally measured with). Both were measured clean on
      # main 2026-09-08 — 0 errors, plus two pre-existing no-unused-vars
      # warnings in writeGames.test.ts. eslint exits 0 on warnings, so this
      # gates on errors only; tightening it to `--max-warnings 0` means fixing
      # those two first and is deliberately not bundled here.
      - run: npm run lint
      - run: npm test

  # e2e needs the real stack: a local Supabase, a seeded database and a dev
  # server. Split from `check` so a type error does not wait on Docker.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # The suite runs single-worker by design (playwright.config.ts sets
    # workers: 1, fullyParallel: false) and takes ~10 min locally; add image
    # pulls for `supabase start` on a cold runner and 30 is uncomfortably tight.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The pinned CLI from devDependencies, not a floating one. `start` applies
      # the migrations in supabase/migrations, so 0032 has to be on the branch
      # for the membership tests to have a profile_leagues table to read.
      - name: Start Supabase
        run: npx supabase start

      # Written to .env.local rather than the job env because three separate
      # things read it: playwright.config.ts (via dotenv), `next dev`, and
      # scripts/seed-users.mjs (via --env-file-if-exists).
      - name: Write .env.local
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env 2>/dev/null)"
          cat > .env.local <<ENV
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          SUPABASE_SECRET_KEY=$SECRET_KEY
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          ENV

      # e2e/global-setup.ts resets and seeds the database, and playwright.config
      # starts the dev server. ENABLE_DEV_LOGIN is deliberately unset: the dev
      # sign-in panel the suite uses is on by default outside a production
      # build, and setting it here would be one more place to forget it.
      #
      # Kept in a file as well as the log because the step below greps it: the
      # dev server's own console arrives here as `[WebServer]` lines, and that
      # is the only place a failed read inside a server component says so.
      #
      # ⛔ `set -o pipefail`, or `tee` returns 0 and a FAILING SUITE PASSES CI.
      - name: Run end-to-end tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-output.log

      # Why the stack failed, not just which assertion gave up.
      #
      # A read inside `getPublishState` failing tells us Kong had nothing to
      # talk to; it does not say whether PostgREST was restarting, OOM-killed or
      # merely slow. `docker logs` alone does not answer that either — the
      # restart count and `OOMKilled` in `docker inspect` are the part that
      # does, so both are captured.
      #
      # ⚠️ RUNS ON GREEN RUNS TOO, AND THAT IS THE WHOLE POINT. `getPublishState`
      # now retries a failed read, so the next occurrence will most likely be
      # ABSORBED and the run will pass — which is exactly what run 34057958405
      # did even before the retry existed. Collecting only on failure would
      # gather evidence for the one case we no longer expect to see.
      - name: Capture Supabase diagnostics
        if: always()
        id: diag
        run: |
          mkdir -p supabase-diagnostics
          docker ps -a > supabase-diagnostics/containers.txt 2>&1 || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_' || true); do
            # Tailed: Postgres alone will happily produce tens of megabytes.
            docker logs --tail 5000 "$c" > "supabase-diagnostics/$c.log" 2>&1 || true
            docker inspect -f \
              'Name={{.Name}} Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Restarts={{.RestartCount}}' \
              "$c" >> supabase-diagnostics/state.txt 2>&1 || true
          done
          # ⛔ BOTH SPELLINGS. `read retried` is the ABSORBED case — a blip the
          # retry swallowed, which is now the outcome we EXPECT and the whole
          # reason this step runs on green runs. Grepping only for `read failed`
          # would match just the double failure, so the common case would go
          # uncollected and this step would look like it never fires.
          if grep -qE "read failed|read retried" e2e-output.log 2>/dev/null; then
            echo "transient=true" >> "$GITHUB_OUTPUT"
            echo "::warning::An upstream read failed or was retried during this run — see the playwright-report artifact"
            grep -nE "read failed|read retried" e2e-output.log || true
          else
            echo "transient=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        if: failure() || steps.diag.outputs.transient == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            supabase-diagnostics/
            e2e-output.log
          # The reporter is `list`, so playwright-report/ often does not exist;
          # test-results/ holds the failure screenshots. Missing one is normal.
          if-no-files-found: ignore
          retention-days: 7
